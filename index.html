<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çok Kanallı Şarkı Dinleyici (6 Şarkı)</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1c2026;
      --border: #2c323b;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #10b981;
      --mute: #ef4444;
      --solo: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .mixer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .mixer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h2 { margin: 0; font-size: 1.2rem; font-weight: 600; }
    .song-badge {
      font-size: 0.75rem;
      color: var(--muted);
      background: #14171c;
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }
    .transport {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #14171c;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    button {
      background: #262c36;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #323946; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; }
    .btn-play:hover:not(:disabled) { background: #0d9668; }
    .progress {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 85px;
      text-align: right;
    }
    .tracks { display: flex; flex-direction: column; gap: 10px; }
    .track {
      display: grid;
      grid-template-columns: 165px auto 1fr auto;
      align-items: center;
      gap: 14px;
      background: #161a20;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
    }
    .track-name { font-weight: 600; font-size: 0.92rem; }
    .track-status { font-size: 0.74rem; color: var(--muted); }
    .ms { display: flex; gap: 6px; }
    .btn-m, .btn-s { width: 34px; height: 34px; padding: 0; font-size: 0.85rem; }
    .btn-m.active { background: var(--mute); border-color: var(--mute); color: #fff; }
    .btn-s.active { background: var(--solo); border-color: var(--solo); color: #111; }
    .vol { display: flex; align-items: center; gap: 8px; }
    .file-btn {
      font-size: 0.76rem;
      background: #21262d;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      white-space: nowrap;
    }
    .file-btn:hover { color: var(--text); border-color: #484f58; }
    @media (max-width: 600px) {
      .track { grid-template-columns: 1fr auto; }
      .vol { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

<div class="container" id="app"></div>

<script>
  /**
   * 6 ŞARKI YAPILANDIRMASI
   * Her şarkı için başlık ve ilgili 3 kanalın dosya yollarını buraya girin.
   */
  const songsConfig = [
    {
      title: "Küçük Kara Balık",
      tracks: [
        { name: "Temel", url: "temel-kkb.mp3" },
        { name: "Bas",   url: "bas-kkb.mp3" },
        { name: "Ritim", url: "ritim-kkb.mp3" }
      ]
    },
    {
      title: "Hav Hav",
      tracks: [
        { name: "Temel", url: "temel-hav.mp3" },
        { name: "Bas",   url: "bas-hav.mp3" },
        { name: "Ritim", url: "davul-hav.mp3" }
      ]
    },
    {
      title: "Duymayan Kalamsın",
      tracks: [
        { name: "Temel", url: "temel-sdk.mp3" },
        { name: "Bas",   url: "bas-sdk.mp3" },
        { name: "Ritim", url: "ritim-sdk.mp3" }
      ]
    },
    {
      title: "Ayna",
      tracks: [
        { name: "Temel", url: "temel-ayna.mp3" },
        { name: "Bas",   url: "bas-ayna.mp3" },
        { name: "Ritim", url: "ritim-ayna.mp3" }
      ]
    },
    {
      title: "Kanki-Kanka",
      tracks: [
        { name: "Temel", url: "temel-kanki.mp3" },
        { name: "Bas",   url: "bas-kanki.mp3" },
        { name: "Ritim", url: "ritim-kanki.mp3" }
      ]
    }
  ];

  // Tüm oynatıcıların ortak kullanacağı tek AudioContext
  let sharedAudioCtx = null;
  const allPlayers = [];

  function getAudioContext() {
    if (!sharedAudioCtx) {
      sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (sharedAudioCtx.state === "suspended") {
      sharedAudioCtx.resume();
    }
    return sharedAudioCtx;
  }

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec < 10 ? "0" : ""}${sec}`;
  }

  class MultitrackPlayer {
    constructor(songCfg, songIdx, containerEl) {
      this.songIdx = songIdx;
      this.title = songCfg.title;
      this.isPlaying = false;
      this.startTime = 0;
      this.pauseOffset = 0;
      this.duration = 0;
      this.raf = null;

      this.tracks = songCfg.tracks.map((c, i) => ({
        id: i,
        name: c.name,
        url: c.url,
        buffer: null,
        source: null,
        gain: null,
        vol: 1,
        muted: false,
        solo: false
      }));

      this.render(containerEl);
      this.loadAll();
    }

    render(containerEl) {
      const mixer = document.createElement("div");
      mixer.className = "mixer";
      mixer.innerHTML = `
        <div class="mixer-header">
          <h2>${this.title}</h2>
          <span class="song-badge">${this.tracks.length} Kanal</span>
        </div>
        <div class="transport">
          <button class="btn-play" disabled>Yükleniyor...</button>
          <button class="btn-stop" disabled>Durdur</button>
          <div class="progress">
            <input type="range" class="seek-bar" min="0" max="100" value="0" step="0.1" disabled />
            <span class="time">0:00 / 0:00</span>
          </div>
        </div>
        <div class="tracks"></div>
      `;
      containerEl.appendChild(mixer);

      this.playBtn = mixer.querySelector(".btn-play");
      this.stopBtn = mixer.querySelector(".btn-stop");
      this.seekBar = mixer.querySelector(".seek-bar");
      this.timeDisplay = mixer.querySelector(".time");
      this.tracksEl = mixer.querySelector(".tracks");

      this.tracks.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "track";
        row.innerHTML = `
          <div>
            <div class="track-name">${t.name}</div>
            <div class="track-status">Bekleniyor...</div>
          </div>
          <div class="ms">
            <button class="btn-m" title="Sessize Al (Mute)">M</button>
            <button class="btn-s" title="Tek Dinle (Solo)">S</button>
          </div>
          <div class="vol">
            <span style="font-size:0.8rem;color:#8b949e">Ses</span>
            <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="1" />
          </div>
          <label class="file-btn">Dosya Seç<input type="file" accept="audio/*" hidden /></label>
        `;
        this.tracksEl.appendChild(row);

        t.nameEl = row.querySelector(".track-name");
        t.statusEl = row.querySelector(".track-status");
        const mBtn = row.querySelector(".btn-m");
        const sBtn = row.querySelector(".btn-s");
        const vSlider = row.querySelector(".vol-slider");
        const fileInput = row.querySelector("input[type='file']");

        mBtn.onclick = () => {
          t.muted = !t.muted;
          mBtn.classList.toggle("active", t.muted);
          this.updateGains();
        };

        sBtn.onclick = () => {
          t.solo = !t.solo;
          sBtn.classList.toggle("active", t.solo);
          this.updateGains();
        };

        vSlider.oninput = (e) => {
          t.vol = +e.target.value;
          this.updateGains();
        };

        fileInput.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const ctx = getAudioContext();
          const wasPlaying = this.isPlaying;
          if (wasPlaying) this.pause();

          t.statusEl.textContent = "Çözümleniyor...";
          t.buffer = await ctx.decodeAudioData(await file.arrayBuffer());
          t.nameEl.textContent = file.name.replace(/\.[^/.]+$/, "");
          t.statusEl.textContent = `Hazır (${fmt(t.buffer.duration)})`;
          this.updateDur();
          if (wasPlaying) this.play();
        };
      });

      this.playBtn.onclick = () => (this.isPlaying ? this.pause() : this.play());
      this.stopBtn.onclick = () => this.stop();
      this.seekBar.oninput = (e) => {
        this.pauseOffset = +e.target.value;
        this.timeDisplay.textContent = `${fmt(this.pauseOffset)} / ${fmt(this.duration)}`;
        if (this.isPlaying) this.play();
      };
    }

    async loadAll() {
      const ctx = getAudioContext();
      await Promise.all(
        this.tracks.map(async (t) => {
          try {
            t.statusEl.textContent = "Yükleniyor...";
            const res = await fetch(t.url);
            if (!res.ok) throw new Error();
            t.buffer = await ctx.decodeAudioData(await res.arrayBuffer());
            t.statusEl.textContent = `Hazır (${fmt(t.buffer.duration)})`;
          } catch {
            t.statusEl.textContent = "Dosya seçin veya yolu kontrol edin";
          }
        })
      );
      this.updateDur();
    }

    updateDur() {
      const loaded = this.tracks.filter((t) => t.buffer).map((t) => t.buffer.duration);
      if (!loaded.length) {
        this.playBtn.textContent = "Kanal Seçin";
        return;
      }
      this.duration = Math.max(...loaded);
      this.seekBar.max = this.duration;
      this.playBtn.disabled = false;
      this.stopBtn.disabled = false;
      this.seekBar.disabled = false;
      this.playBtn.textContent = this.isPlaying ? "Duraklat" : "Oynat";
      this.timeDisplay.textContent = `${fmt(this.pauseOffset)} / ${fmt(this.duration)}`;
    }

    updateGains() {
      if (!sharedAudioCtx) return;
      const anySolo = this.tracks.some((t) => t.solo);
      this.tracks.forEach((t) => {
        if (!t.gain) return;
        const on = anySolo ? t.solo : !t.muted;
        t.gain.gain.setTargetAtTime(on ? t.vol : 0, sharedAudioCtx.currentTime, 0.015);
      });
    }

    play() {
      // Diğer çalan şarkıları otomatik duraklat (üst üste binmeyi önler)
      allPlayers.forEach((p) => {
        if (p !== this && p.isPlaying) p.pause();
      });

      const ctx = getAudioContext();
      this.stopSources();
      const now = ctx.currentTime;
      this.startTime = now - this.pauseOffset;

      this.tracks.forEach((t) => {
        if (!t.buffer || this.pauseOffset >= t.buffer.duration) return;
        const src = ctx.createBufferSource();
        src.buffer = t.buffer;
        const g = ctx.createGain();
        src.connect(g);
        g.connect(ctx.destination);
        t.source = src;
        t.gain = g;
        src.start(now, this.pauseOffset);
      });

      this.updateGains();
      this.isPlaying = true;
      this.playBtn.textContent = "Duraklat";
      this.loop();
    }

    pause() {
      if (!this.isPlaying) return;
      this.pauseOffset = sharedAudioCtx.currentTime - this.startTime;
      this.stopSources();
      this.isPlaying = false;
      this.playBtn.textContent = "Oynat";
      cancelAnimationFrame(this.raf);
    }

    stop() {
      this.stopSources();
      this.isPlaying = false;
      this.pauseOffset = 0;
      this.seekBar.value = 0;
      this.playBtn.textContent = "Oynat";
      this.timeDisplay.textContent = `0:00 / ${fmt(this.duration)}`;
      cancelAnimationFrame(this.raf);
    }

    stopSources() {
      this.tracks.forEach((t) => {
        if (t.source) {
          try { t.source.stop(); } catch {}
          t.source = null;
        }
      });
    }

    loop() {
      if (!this.isPlaying) return;
      const cur = sharedAudioCtx.currentTime - this.startTime;
      if (cur >= this.duration) {
        this.stop();
        return;
      }
      this.seekBar.value = cur;
      this.timeDisplay.textContent = `${fmt(cur)} / ${fmt(this.duration)}`;
      this.raf = requestAnimationFrame(() => this.loop());
    }
  }

  const appEl = document.getElementById("app");
  songsConfig.forEach((song, idx) => {
    allPlayers.push(new MultitrackPlayer(song, idx, appEl));
  });
</script>
</body>
</html>
